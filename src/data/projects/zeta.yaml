slug: zeta
name: Zeta
repo: WorkerHub/Zeta
source: official
tagline_zh: Cloudflare D1 数据库查询与管理工具
description_zh: >-
  Zeta 是自托管的 Cloudflare D1 数据库查询界面：每位用户可建多个命名 SQL Notebook，
  每个标签页独立绑定一个 D1 数据库，并按用户分配只读或读写权限。编辑器带语法高亮与执行计时，
  查询结果会随 Notebook 一起保存、可回看历史；应用自身也跑在 Workers 上，会话与 2FA 状态存 KV，
  唯一的外部依赖是发信服务（Resend 或 SMTP）。
features:
  - SQL Notebook：多标签页、自动保存，每页独立绑定一个 D1 数据库
  - 多数据库连接，按用户分配 read / write 权限，管理后台统一管理
  - 查询结果与运行历史保留（单次最多 5000 行），可切换、删除、清空
  - 邮箱密码登录 + 可选 TOTP / 邮件 OTP / Passkey 二步验证
  - 中英双语与三档主题，部署后由 GitHub Actions 自动上线
category: data
tags:
