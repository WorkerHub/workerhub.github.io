slug: hop
name: hop
repo: WorkerHub/hop
source: official
tagline_zh: 短链接服务：生成、跳转、过期清理
description_zh: >-
  hop（原名 shortlink，2026-10-26 改名）是自托管的短链接服务：生成短链、跳转、按日期或天数自动过期清理，
  并记录点击分析。跳转走 KV 缓存、点击日志异步落库，不阻塞重定向；多用户支持开放注册或仅限邀请，
  另有管理面板与三种双因素认证。运行在 Workers + D1 + KV 上。
features:
  - 随机 4 字符 slug 或自定义别名
  - 点击分析：国家、设备、浏览器、操作系统与来源
  - 按日期或天数设置过期时间，cron 每日清理
  - 多用户（邀请制或开放注册）+ 三种二步验证（TOTP / Passkey / 邮件 OTP）
  - KV 缓存跳转，点击统计异步写入
category: other
tags:
  - 短链接
  - 跳转
  - 点击统计
docs_url: https://github.com/WorkerHub/hop/blob/main/README.zh-CN.md
deploy:
  method: github-actions
  guide_url: https://github.com/WorkerHub/hop/blob/main/README.zh-CN.md
resources:
  - d1
  - kv
  - cron
difficulty: 2
free_tier: yes
tier: official
featured: false
